<svg id="Icon" xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" role="img" aria-label="Cookie-Editor icon">
  <defs>
    <mask id="bite-outer">
      <rect width="520" height="520" fill="white"/>
      <circle cx="164" cy="92" r="51" fill="black"/>
      <circle cx="104" cy="150" r="46" fill="black"/>
      <circle cx="207" cy="54" r="35" fill="black"/>
    </mask>
    <mask id="bite-inner">
      <rect width="520" height="520" fill="white"/>
      <circle cx="164" cy="92" r="64" fill="black"/>
      <circle cx="104" cy="150" r="59" fill="black"/>
      <circle cx="207" cy="54" r="47" fill="black"/>
    </mask>
    <linearGradient id="cookie-fill" x1="135" y1="96" x2="392" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0b35e"/>
