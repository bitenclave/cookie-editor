    <circle cx="315" cy="152" r="31" fill="#4a2612"/>
    <circle cx="214" cy="242" r="31" fill="#4a2612"/>
    <circle cx="358" cy="305" r="27" fill="#4a2612"/>
    <circle cx="182" cy="357" r="28" fill="#4a2612"/>
    <circle cx="303" cy="377" r="23" fill="#4a2612"/>
  </g>
</svg>
